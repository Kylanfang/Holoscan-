<script>
const pages={
  "overview": {
    "title": "L0 · 目标架构与缺口",
    "desc": "四项首要阻断；节点可下钻",
    "file": "standalone/00-embodied-system-overview.html",
    "status": "mixed",
    "label": "目标待验证"
  },
  "hsb": {
    "title": "L1 · HSB 官方参考",
    "desc": "RoCE 主路径与事件分离",
    "file": "standalone/01-hsb-reference.html",
    "status": "reference",
    "label": "参考已核对"
  },
  "multimodal": {
    "title": "L2 · 多模态前端",
    "desc": "独立流、采样事件与格式责任",
    "file": "standalone/02-multimodal-fpga-preprocess.html",
    "status": "mixed",
    "label": "材料声明 / 拟议"
  },
  "datapath": {
    "title": "L2 · HSB 数据面",
    "desc": "TKEEP、窗口、FIFO 与过载",
    "file": "standalone/03-hsb-datapath.html",
    "status": "mixed",
    "label": "参考 / 待设计"
  },
  "control": {
    "title": "L2 · HSB 控制面",
    "desc": "事务、时钟复位与恢复责任",
    "file": "standalone/04-hsb-control.html",
    "status": "mixed",
    "label": "参考 / 待绑定"
  },
  "host": {
    "title": "L2 · 主机接收分支",
    "desc": "RoCE、Socket、GPU 消费条件",
    "file": "standalone/05-host-holoscan.html",
    "status": "pending",
    "label": "项目待绑定"
  },
  "verification": {
    "title": "L3 · 工程签收",
    "desc": "版本、阈值、证据与测试",
    "file": "standalone/06-engineering-verification.html",
    "status": "pending",
    "label": "未签收"
  },
  "buffer": {
    "title": "L3 · 缓冲生命周期",
    "desc": "状态、隔离与真实复用机制",
    "file": "standalone/07-buffer-lifecycle.html",
    "status": "pending",
    "label": "拟议协议"
  },
  "sequence": {
    "title": "L3 · 接收消费时序",
    "desc": "CQE、校验、可见性与复用",
    "file": "standalone/08-frame-receive-sequence.html",
    "status": "pending",
    "label": "拟议顺序"
  },
  "recovery": {
    "title": "L3 · 启动与故障恢复",
    "desc": "禁流、就绪、DMA 排空与重建",
    "file": "standalone/09-startup-recovery.html",
    "status": "pending",
    "label": "拟议协议"
  },
  "realtime": {
    "title": "L3 · 实时执行域",
    "desc": "本地反馈、目标有效期与停机",
    "file": "standalone/10-realtime-control.html",
    "status": "pending",
    "label": "规划待实现"
  },
  "platform": {
    "title": "L3 · 板级与部署资源",
    "desc": "BOM、资源、PCIe、供电散热",
    "file": "standalone/11-platform-resources.html",
    "status": "pending",
    "label": "证据待绑定"
  },
  "formats": {
    "title": "L3 · 算法与格式分工",
    "desc": "RAW 与 FPGA 处理候选配置",
    "file": "standalone/12-format-placement.html",
    "status": "pending",
    "label": "候选未冻结"
  },
  "contracts": {
    "title": "工程接口契约台账",
    "desc": "21 项契约、关闭条件与证据状态",
    "file": "engineering/contracts.html",
    "status": "pending",
    "label": "项目验证通过 0"
  },
  "review": {
    "title": "审查与可重算预算",
    "desc": "修改映射、带宽与缓存计算",
    "file": "engineering/review.html",
    "status": "mixed",
    "label": "预算不是实测"
  }
};
const nodeRoutes={
  "sensors": "multimodal",
  "fpga-pre": "multimodal",
  "align": "multimodal",
  "transport": "hsb",
  "gpu-buffer": "buffer",
  "fusion": "host",
  "orchestrator": "host",
  "planning": "realtime",
  "rt-control": "realtime",
  "actuators": "realtime",
  "world": "realtime",
  "fpga-dp": "datapath",
  "fpga-ctrl": "control",
  "rx-op": "sequence",
  "gpu-mem": "buffer",
  "completion": "sequence",
  "cx": "platform",
  "camera": "formats",
  "video-pipe": "formats",
  "audio-pipe": "formats",
  "tensor-pack": "contracts",
  "sensor-front": "contracts",
  "cdc-fifo": "contracts",
  "packetizer": "review",
  "clocks": "recovery",
  "ptp": "contracts",
  "operators": "sequence",
  "cx7": "platform",
  "rdma-io": "platform",
  "metrics": "review",
  "evidence": "contracts",
  "requirements": "review",
  "contracts": "contracts",
  "rt-planner": "formats",
  "rt-monitor": "contracts",
  "hw-fpga": "contracts",
  "hw-pcie": "host",
  "fmt-a-net": "review",
  "fmt-b-net": "review"
};
const nav=document.getElementById('nav'),frame=document.getElementById('frame'),enter=document.getElementById('enter'),hint=document.getElementById('hint'),crumb=document.getElementById('crumb'),standalone=document.getElementById('standalone');
let current='overview',pending=null;
for(const [id,p] of Object.entries(pages)){
  const b=document.createElement('button');b.type='button';b.dataset.page=id;b.innerHTML=`<strong>${p.title}</strong><small>${p.desc}</small><span class="status ${p.status}">${p.label}</span>`;b.onclick=()=>go(id);nav.appendChild(b);
}
function route(){const id=location.hash.replace(/^#\/?/,'');return pages[id]?id:'overview'}
function go(id){if(!pages[id])return;location.hash='#/'+id}
function render(){current=route();const p=pages[current];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===current));crumb.textContent=`架构门户 / ${p.title}`;standalone.href=p.file;if(p.file.startsWith('standalone/')){frame.removeAttribute('src');frame.srcdoc=portalDocuments[p.file].replace('<html ', '<html data-embed="true" ');}else{frame.removeAttribute('srcdoc');frame.src=p.file;}pending=null;enter.hidden=true;hint.textContent=current==='overview'?'单击节点选择下钻，双击直接进入；本页为目标架构。':`${p.title}；相关节点可下钻，其余页面使用左侧导航。`}
function selectNode(node){const target=nodeRoutes[node.dataset.nodeId];if(!target)return;pending=target;hint.innerHTML=`已选择 <strong>${node.dataset.nodeLabel||node.dataset.nodeId}</strong>，可进入 ${pages[target].title}`;enter.textContent=`进入 ${pages[target].title}`;enter.hidden=false}
frame.addEventListener('load',()=>{try{const d=frame.contentDocument;d.querySelectorAll('[data-node-id]').forEach(n=>{if(!nodeRoutes[n.dataset.nodeId])return;n.style.cursor='zoom-in';n.addEventListener('click',()=>selectNode(n));n.addEventListener('dblclick',e=>{e.preventDefault();e.stopPropagation();go(nodeRoutes[n.dataset.nodeId])})})}catch(err){hint.textContent='当前浏览器限制了本地 iframe 交互；请使用左侧层级导航进入子图。'}});
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||!event.data||event.data.type!=='archify-node-activate')return;const id=event.data.nodeId;if(!nodeRoutes[id])return;if(event.data.activation==='dblclick')go(nodeRoutes[id]);else selectNode({dataset:{nodeId:id,nodeLabel:event.data.nodeLabel||id}})});
enter.onclick=()=>pending&&go(pending);document.getElementById('back').onclick=()=>current==='overview'?history.back():go('overview');window.addEventListener('hashchange',render);render();
</script>
</body>
