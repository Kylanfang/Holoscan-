let status='all';const grid=document.getElementById('grid');
function render(){const q=document.getElementById('search').value.toLowerCase(),p=document.getElementById('priority').value;const filtered=data.filter(c=>(status==='all'||c.status===status)&&(p==='all'||c.priority===p)&&JSON.stringify(c).toLowerCase().includes(q));grid.innerHTML=filtered.map(c=>'<article class="card" id="'+c.id+'"><h2>'+escapeHtml(c.id+' · '+c.title)+'</h2><span class="badge p0">'+c.priority+'</span><span class="badge">'+labels[c.status]+'</span><p class="muted">'+escapeHtml(c.route)+'</p><dl>'+[['责任角色',c.owner_role+'；姓名待指定'],['载荷 / 接口',c.payload],['时钟 / 所有权',c.timing_and_ownership],['当前证据',c.evidence],['关闭条件',c.acceptance],['实现与测试','实现路径、项目版本、测试编号待绑定；'+c.test_result]].map(([k,v])=>'<dt>'+k+'</dt><dd>'+escapeHtml(v)+'</dd>').join('')+'</dl><a href="'+c.diagram+'">打开相关架构图</a>'+(c.reference?' · <a href="'+c.reference+'" target="_blank" rel="noopener">官方参考</a>':'')+'</article>').join('');document.getElementById('count').textContent='显示 '+filtered.length+' / '+data.length+' 项';}
for(const [key,label] of [['all','全部状态'],...Object.entries(labels)]){const b=document.createElement('button');b.textContent=label;b.className=key==='all'?'active':'';b.onclick=()=>{status=key;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b));render()};document.getElementById('filters').append(b)}
document.getElementById('metrics').innerHTML=[['契约总数',data.length],['P0 签收阻断',data.filter(c=>c.priority==='P0').length],['材料声明',data.filter(c=>c.status==='reported').length],['项目验证通过',data.filter(c=>c.status==='project_verified').length]].map(([k,v])=>'<div class="metric"><b>'+v+'</b>'+k+'</div>').join('');document.getElementById('search').oninput=render;document.getElementById('priority').onchange=render;render();
</script></body></html>
